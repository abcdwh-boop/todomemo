<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월간 할 일 보기 (큰 달력)</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <div class="calendar-container">
    <!-- 달력 헤더 제어부 -->
    <header class="calendar-header">
      <div class="month-nav">
        <button class="nav-btn" id="prev-month-btn" title="이전 달">&lt;</button>
        <span class="current-month-display" id="month-display">2026년 6월</span>
        <button class="nav-btn" id="next-month-btn" title="다음 달">&gt;</button>
      </div>
      <button class="today-btn" id="today-btn">이번 달로</button>
    </header>

    <!-- 월간 그리드 영역 -->
    <main class="calendar-grid">
      <div class="weekdays-header">
        <div class="weekday" style="color: #ef4444;">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday">토</div>
      </div>
      <div class="days-grid" id="days-grid">
        <!-- JS로 동적 생성 -->
      </div>
    </main>
  </div>

  <!-- 비즈니스 모듈 로드 -->
  <script src="modules/taskRepository.js"></script>
  <script src="modules/calendarService.js"></script>
  <!-- 렌더러 로직 로드 -->
  <script src="calendar-renderer.js"></script>
</body>
</html>
